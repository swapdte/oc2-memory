name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm >= 11.5.1, which is what Node 24 ships.
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Trusted publishing requires npm CLI >= 11.5.1; take the newest so the
      # OIDC exchange is available whatever the runner image bundles.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "Publishing requires a v* tag ref; got $GITHUB_REF." >&2
              echo "For manual runs, dispatch the workflow from the release tag." >&2
              exit 1
              ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance
